name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache git libffi-dev libssl-dev python3-dev zip unzip zlib1g-dev openjdk-17-jdk
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade buildozer Cython "kivy<2.4.0"

      - name: Build with Buildozer
        run: |
          # تنظيف أي ملفات مؤقتة سابقة تسببت في خطأ pip
          rm -rf ~/.buildozer
          rm -rf .buildozer
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ahmed-app-apk
          path: bin/*.apk
